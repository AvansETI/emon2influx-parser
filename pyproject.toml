[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emon2influx-parser"
version = "0.1.0"
description = "Parses P1 telegrams from EMON kits (MQTT) and writes them to InfluxDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "influxdb-client>=1.40,<2",
  "python-dotenv>=1.0,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
emon2influx-parser = "emon2influx.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["influxdb_client.*", "urllib3.*"]
ignore_missing_imports = true

# influxdb-client ships partial annotations.
[[tool.mypy.overrides]]
module = ["emon2influx.points", "emon2influx.fieldmap", "emon2influx.sink.writer"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
