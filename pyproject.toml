[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "emon2influx-parser"
version = "0.1.0"
description = "Parses P1 telegrams from EMON kits (MQTT) and writes them to InfluxDB"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Arno Broeders" }]
requires-python = ">=3.12"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "influxdb-client>=1.40,<2",
  "python-dotenv>=1.0,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "shellcheck-py>=0.10"]

[project.scripts]
emon2influx-parser = "emon2influx.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Written by CI with the git commit (doc/architecture.md §11.1); absent in development.
emon2influx = ["build.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["influxdb_client.*", "urllib3.*"]
ignore_missing_imports = true

# influxdb-client ships partial annotations.
[[tool.mypy.overrides]]
module = [
  "emon2influx.points",
  "emon2influx.fieldmap",
  "emon2influx.sink.writer",
  "emon2influx.tools.fix_orientation.store",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
